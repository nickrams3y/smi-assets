<style id="sm-product-loading-style">#tile-product-details div.ecwid-productBrowser{background:#fff!important}html.sm-product-pending #tile-product-details .product-details__sidebar>*{visibility:hidden!important}html.sm-product-pending #tile-product-details .product-details__product-description .sm-platform-logos{display:none!important}</style>
<script id="sm-product-loading-boot">(()=>{if(window.SMI_PRODUCT_BOOT)return;let r=document.documentElement,t,p,f=false,c='sm-product-pending';function end(){clearTimeout(t);clearInterval(p);f=false;r.classList.remove(c)}function check(){if(f&&getComputedStyle(r).getPropertyValue('--sm-product-layout-styles').trim()==='1')end()}function begin(){end();r.classList.add(c);t=setTimeout(end,6000);p=setInterval(check,50)}window.SMI_PRODUCT_BOOT={begin,cancel:end,finish(){if(r.classList.contains(c)){f=true;check()}}};if(/^\/products(?:\/|$)/.test(location.pathname))begin();addEventListener('pageshow',e=>{if(e.persisted)end()})})();</script>
